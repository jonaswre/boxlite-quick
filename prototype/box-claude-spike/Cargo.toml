[package]
name = "box-claude-spike"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
boxlite = "=0.11.0"
futures = "0.3.34"
nix = { version = "0.30.1", features = ["term", "signal", "ioctl"] }
term_size = "0.3.2"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
