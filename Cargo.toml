[package]
name = "boxq"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
boxlite = "=0.11.0"
boxlite-shared = "=0.11.0"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.191"
rustix = { version = "1.1.6", features = ["event", "process", "termios"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "signal"] }
tokio-util = "0.7.20"
toml = "1.1.8"
url = "2.5.8"

[dev-dependencies]
rustix = { version = "1.1.6", features = ["pty"] }
tempfile = "3.27.0"
