[package]
name = "boxq"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
boxlite = "=0.11.0"
boxlite-shared = "=0.11.0"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.191"
rustix = { version = "1.1.6", features = ["event", "process", "termios"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
tokio = { version = "1.54.1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "signal"] }
tokio-util = "0.7.20"
toml = "1.1.8"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
rustix = { version = "1.1.6", features = ["pty"] }
tempfile = "3.27.0"

# BoxLite unpacks and verifies image layers with these. Unoptimized, they took 90 s over the Base
# Image in the real-Box tests; optimized, 19 s (jonaswre/boxlite-quick#44).
[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.adler2]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
