[package]
name = "boxq"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
boxlite = "=0.11.0"
clap = { version = "4.6.7", features = ["derive"] }
sha2 = "0.11.1"

[dev-dependencies]
boxlite-shared = "=0.11.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tokio-util = "0.7.20"
